name: Import SDK 52 tree to master

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sdk52-import
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip SDK 52 tree and replace master
        run: |
          set -euxo pipefail
          unzip -q musicfree-sdk52.zip -d /tmp/sdk52
          test -f /tmp/sdk52/MusicFree-ios/package.json
          grep -E '"expo"|"react-native"' /tmp/sdk52/MusicFree-ios/package.json
          git fetch origin master
          git checkout master
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/sdk52/MusicFree-ios/. .
          git add -A
          git status --short | head -100
          grep -E '"expo"|"react-native"' package.json
          git -c user.name="BingYuanIgloo" -c user.email="BingYuanIgloo@users.noreply.github.com" commit -m "Replace master with MusicFree iOS SDK 52 tree (Expo 52, React Native 0.76.5)"
          git push origin master
