name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install yarn 1.22
        run: npm install -g yarn@1.22.22

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Copy Live Activity module into widget-extension pod
        run: |
          # react-native-widget-extension 的 config plugin 本应在 expo prebuild 时
          # 把 Module.swift / Attributes.swift 拷进它自己的 ios/ 目录，再由
          # ReactNativeWidgetExtension 这个 pod 编进主 App；本项目不跑 prebuild，
          # 这里手工做同样的一步（必须在 pod install 之前）。
          # 包还没装进 package.json 时这一步自动跳过：构建照常成功，只是
          # 原生模块缺失，JS 侧静默 no-op（灵动岛不出现，App 不受影响）。
          if [ -d node_modules/react-native-widget-extension/ios ]; then
            cp ios/MusicFreeWidgets/Module.swift ios/MusicFreeWidgets/Attributes.swift node_modules/react-native-widget-extension/ios/
            echo "Copied Module.swift + Attributes.swift into ReactNativeWidgetExtension pod"
          else
            echo "react-native-widget-extension not installed; Live Activity native module will be absent (JS degrades gracefully)"
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild -workspace MusicFree.xcworkspace -scheme MusicFreeNew -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "Built app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MusicFree-unsigned.ipa Payload

      - name: Verify app and Live Activity extension
        run: |
          set -euxo pipefail
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/MusicFreeWidgets.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP_PATH/PlugIns/MusicFreeWidgets.appex/Info.plist")" = "com.apple.widgetkit-extension"
          echo "App exists. Live Activity extension exists."
          echo "Embedded plug-ins:"
          find "$APP_PATH/PlugIns" -maxdepth 2 -type d -print

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-unsigned-ipa
          path: ios/MusicFree-unsigned.ipa
          retention-days: 14

  simulator-smoke-test:
    needs: build-ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install yarn 1.22
        run: npm install -g yarn@1.22.22

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Copy Live Activity module into widget-extension pod
        run: |
          if [ -d node_modules/react-native-widget-extension/ios ]; then
            cp ios/MusicFreeWidgets/Module.swift ios/MusicFreeWidgets/Attributes.swift node_modules/react-native-widget-extension/ios/
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build for simulator
        run: |
          cd ios
          xcodebuild -workspace MusicFree.xcworkspace -scheme MusicFreeNew -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build-sim

      - name: Boot simulator, launch app, screenshot home
        run: |
          set -x
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 16" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          echo "Using simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP_PATH=$(find ios/build-sim/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          echo "App: $APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 15
          mkdir -p sim-shots
          xcrun simctl io "$DEVICE" screenshot sim-shots/01-home.png
          ls -la sim-shots/

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: sim-shots/
          retention-days: 14
