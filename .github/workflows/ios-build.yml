name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    # macos-26 = Xcode 26 (iOS 26 SDK)，编译 Liquid Glass 必须；macos-15 只有 Xcode 16。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 注意：本仓库用 npm（package-lock.json）装依赖，不用 yarn。
      # 原因：yarn 1 的 yarn.lock 在这台 Linux 上无法重新生成（见 .npmrc 说明），
      # 而 npm 的 lockfile 已由 Expo SDK 54 升级生成并验证过。
      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild -workspace MusicFree.xcworkspace -scheme MusicFree -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "Built app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MusicFree-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-unsigned-ipa
          path: ios/MusicFree-unsigned.ipa
          retention-days: 14
































