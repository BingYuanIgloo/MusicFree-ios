name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install yarn 1.22
        run: npm install -g yarn@1.22.22

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild -workspace MusicFree.xcworkspace -scheme MusicFree -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "Built app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MusicFree-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-unsigned-ipa
          path: ios/MusicFree-unsigned.ipa
          retention-days: 14
