name: Fix run51 (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply run51 fixes
        run: python3 .github/scripts/fix-run51.py .
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "run51 fix: persistent lyric fallback cache, keep lyric on failed re-fetch"
          git push origin master
