name: Fix run54 (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply run54 fixes
        run: python3 .github/scripts/fix-run54.py .
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "run54 fix: island stuck/delay/lock-screen/buttons, theme light, quality/rate text, Files picker"
          git push origin master
